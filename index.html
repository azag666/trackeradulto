<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Monitor | TJ Stats</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-gray-100 p-6 font-sans selection:bg-indigo-500/30 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-gray-800">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2 text-white">
                    <i data-lucide="activity" class="text-indigo-500"></i>
                    Traffic Monitor <span class="text-gray-500 font-light text-xl">| TJ Stats</span>
                </h1>
                <p class="text-sm text-gray-400 mt-1" id="subtitle-dates">
                    Monitoramento direto da API da TrafficJunky
                </p>
            </div>
            <div class="mt-4 md:mt-0 flex flex-col md:flex-row items-end md:items-center gap-4">
                <span id="cors-warning" class="hidden text-xs bg-yellow-500/10 text-yellow-500 px-3 py-1 rounded-full border border-yellow-500/20 flex items-center gap-1">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i> Modo Simulado Ativo
                </span>
                
                <!-- FILTRO DE DATA -->
                <select 
                    id="date-filter" 
                    onchange="fetchTJData()"
                    class="bg-gray-900 border border-gray-700 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 outline-none transition-colors"
                >
                    <option value="today" selected>Hoje</option>
                    <option value="yesterday">Ontem</option>
                    <option value="7days">Últimos 7 Dias</option>
                    <option value="30days">Últimos 30 Dias</option>
                </select>

                <button 
                    onclick="fetchTJData()"
                    id="refresh-btn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 disabled:opacity-50"
                >
                    <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4"></i>
                    Atualizar Dados
                </button>
            </div>
        </header>

        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-400 text-sm font-medium mb-1">Investimento Total (USD)</p>
                        <h3 id="total-cost" class="text-2xl font-bold text-white">$ 0,00</h3>
                    </div>
                    <div class="p-2 bg-gray-800/80 rounded-lg">
                        <i data-lucide="dollar-sign" class="text-emerald-400 w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-400 text-sm font-medium mb-1">Total de Impressões</p>
                        <h3 id="total-impressions" class="text-2xl font-bold text-white">0</h3>
                    </div>
                    <div class="p-2 bg-gray-800/80 rounded-lg">
                        <i data-lucide="eye" class="text-blue-400 w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-400 text-sm font-medium mb-1">Total de Cliques</p>
                        <h3 id="total-clicks" class="text-2xl font-bold text-white">0</h3>
                    </div>
                    <div class="p-2 bg-gray-800/80 rounded-lg">
                        <i data-lucide="mouse-pointer-click" class="text-indigo-400 w-5 h-5"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Dados -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-gray-800 bg-gray-900/50">
                <h2 class="text-lg font-semibold text-gray-200">Métricas por Source / Campanha</h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-gray-950/50 text-gray-400 uppercase tracking-wider text-xs">
                        <tr>
                            <th class="px-6 py-4 font-medium">Campanha ID</th>
                            <th class="px-6 py-4 font-medium">Investimento (USD)</th>
                            <th class="px-6 py-4 font-medium text-right">Impressões</th>
                            <th class="px-6 py-4 font-medium text-right">Cliques</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-800/50">
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                                Inicializando o dashboard...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        lucide.createIcons();

        const TJ_TOKEN = '0a5cae844058508f0f70eee015ac6d3a8adfbd670fe1c60f7ac3c3f6f1b51fe975ce183c79f2ac31168cd7fed358165736c9b24fb65cf490f8fcd77549b20691';

        const formatCurrency = (value) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
        const formatNumber = (value) => new Intl.NumberFormat('pt-BR').format(value);

        function getDates() {
            const filter = document.getElementById('date-filter').value;
            const end = new Date();
            const start = new Date();

            if (filter === 'yesterday') {
                start.setDate(start.getDate() - 1);
                end.setDate(end.getDate() - 1);
            } else if (filter === '7days') {
                start.setDate(start.getDate() - 7);
            } else if (filter === '30days') {
                start.setDate(start.getDate() - 30);
            }

            const formataData = (data) => data.toISOString().split('T')[0];
            
            return {
                startDate: formataData(start),
                endDate: formataData(end)
            };
        }

        async function fetchTJData() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('refresh-icon');
            const tbody = document.getElementById('table-body');
            const subtitle = document.getElementById('subtitle-dates');
            
            const { startDate, endDate } = getDates();
            subtitle.innerText = `Puxando métricas de ${startDate} até ${endDate}`;

            const ENDPOINT_CORRETO = `api/campaigns/stats.json?start_date=${startDate}&end_date=${endDate}`;
            const TJ_API_URL = '/tj-proxy/' + ENDPOINT_CORRETO;

            btn.disabled = true;
            icon.classList.add('animate-spin');
            tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">Buscando dados na TrafficJunky...</td></tr>`;

            try {
                const response = await fetch(TJ_API_URL, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${TJ_TOKEN}`,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro API: ${response.status}`);
                }

                const data = await response.json();
                console.log(`Dados crus recebidos:`, data);
                renderData(data);

            } catch (error) {
                console.error("Falha ao buscar dados:", error);
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-red-500">Falha ao se conectar.</td></tr>`;
            } finally {
                btn.disabled = false;
                icon.classList.remove('animate-spin');
            }
        }

        function renderData(data) {
            const tbody = document.getElementById('table-body');
            let dadosFinais = [];

            // A MÁGICA ACONTECE AQUI: Lendo a estrutura { "ID": { stats... } }
            if (data && typeof data === 'object' && !Array.isArray(data)) {
                // Pega todos os IDs de campanha (ex: "1013593201") e itera
                Object.keys(data).forEach(idCampanha => {
                    const stats = data[idCampanha];
                    // Garante que é um objeto válido de stats e não algo perdido na API
                    if (stats && typeof stats === 'object') {
                        dadosFinais.push({
                            campaign_id: idCampanha,
                            ...stats
                        });
                    }
                });
            } else if (Array.isArray(data)) {
                dadosFinais = data;
            }

            if (dadosFinais.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">Nenhum investimento registrado neste período.</td></tr>`;
                document.getElementById('total-cost').innerText = formatCurrency(0);
                document.getElementById('total-impressions').innerText = formatNumber(0);
                document.getElementById('total-clicks').innerText = formatNumber(0);
                return;
            }

            let totalCost = 0;
            let totalImp = 0;
            let totalClicks = 0;
            let html = '';

            dadosFinais.forEach(row => {
                // A API pode enviar o custo em nomes diferentes, tentamos vários:
                const cost = parseFloat(row.cost || row.spent || row.amount || row.total_cost || 0);
                const imp = parseInt(row.impressions || row.views || 0);
                const clicks = parseInt(row.clicks || 0);

                totalCost += cost;
                totalImp += imp;
                totalClicks += clicks;

                html += `
                    <tr class="transition-colors hover:bg-gray-800/50">
                        <td class="px-6 py-4 font-mono text-gray-300 font-bold">
                            <span class="bg-indigo-900/40 text-indigo-300 px-2 py-1 rounded border border-indigo-500/20">
                                ID: ${row.campaign_id}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-emerald-400 font-medium">${formatCurrency(cost)}</td>
                        <td class="px-6 py-4 text-right text-gray-300">${formatNumber(imp)}</td>
                        <td class="px-6 py-4 text-right text-gray-300">${formatNumber(clicks)}</td>
                    </tr>
                `;
            });

            // Se quisermos ordenar por gasto/investimento
            // html.sort((a, b) => ...) // Opcional, mantive a ordem que vem da API

            tbody.innerHTML = html;
            document.getElementById('total-cost').innerText = formatCurrency(totalCost);
            document.getElementById('total-impressions').innerText = formatNumber(totalImp);
            document.getElementById('total-clicks').innerText = formatNumber(totalClicks);
        }

        window.onload = fetchTJData;

    </script>
</body>
</html>
